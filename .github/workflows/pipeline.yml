# Pipeline CI/CD de OptiFull:
#   build-test -> calidad (SonarQube Cloud + quality gate) -> system-check (BD +
#   sistema completo en contenedor) -> deploy-qa -> integration-qa -> deploy-prod
#
# PR y push a Pau: solo corre build-test (tests, Ruff, cobertura; sin secrets ni deploys).
# push a main: corre todo (el plan gratuito de SonarQube Cloud solo analiza main). Prod queda esperando aprobacion manual si se configura
# "Required reviewers" en Settings > Environments > production.
#
# Secrets/variables por Environment (Settings > Environments):
#   qa:         secrets DATABASE_URL, RENDER_DEPLOY_HOOK_URL   | variable QA_URL
#   production: secrets DATABASE_URL, RENDER_DEPLOY_HOOK_URL   | variable PROD_URL
# Secrets del repositorio (Settings > Secrets and variables > Actions): SONAR_TOKEN, y QA_USUARIO / QA_CLAVE
# (cuenta con la que las pruebas de integracion inician sesion; se crea con db/crear_usuario.py)
name: Pipeline OptiFull

on:
  push:
    branches: [main, Pau]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  build-test:
    name: Build & Test (backend + frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── Backend (Flask + pipeline de deteccion) ──
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: test/requirements.txt

      - name: Instalar dependencias Python
        run: pip install -r test/requirements.txt

      - name: Verificar que el backend compila
        run: python -m compileall -q frontend/api deteccion deteccion_productos db

      # Reglas que bloquean: errores probables (config en pyproject.toml).
      - name: Analisis estatico Python (Ruff, bloqueante)
        run: ruff check . --output-format github

      # Complejidad y estilo: se reporta para las metricas, sin bloquear.
      - name: Analisis estatico Python (Ruff, reporte de complejidad y estilo)
        run: |
          mkdir -p test-results
          ruff check . --select E9,F,B,S,PL,C90 --exit-zero --statistics | tee test-results/ruff-reporte.txt
          { echo "## Ruff: reporte de complejidad y estilo (no bloquea)"; echo '```';
            cat test-results/ruff-reporte.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # Alcance y opciones de cobertura en pyproject.toml ([tool.coverage]).
      - name: Tests unitarios (con cobertura de sentencia y decision)
        run: >
          python -m pytest -c test/pytest.ini test/unitarios
          --junitxml=test-results/unitarios.xml
          --cov --cov-report=xml:test-results/coverage.xml
          --cov-report=term

      - name: Resumen de cobertura Python
        if: always()
        run: |
          { echo "## Cobertura Python (sentencia + decision)";
            python -m coverage report --format=markdown; } >> "$GITHUB_STEP_SUMMARY"

      # ── Frontend (React + Vite) ──
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias del frontend
        working-directory: frontend
        run: npm ci

      - name: Lint del frontend
        working-directory: frontend
        run: npx oxlint src

      - name: Tests del frontend (con cobertura)
        working-directory: frontend
        run: npm run test:coverage

      # Node escribe las rutas relativas a frontend/; SonarQube Cloud las espera
      # relativas a la raiz del repo.
      - name: Reporte de cobertura del frontend para SonarQube Cloud
        run: sed 's|^SF:|SF:frontend/|' frontend/lcov.info > test-results/lcov.info

      - name: Build del frontend
        working-directory: frontend
        run: npm run build

      - name: Publicar resultados de tests y cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/

  # ────────────────────────────────────────────────────────────────────────────
  calidad:
    name: Analisis estatico (SonarQube Cloud) + quality gate
    needs: build-test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # historial completo: Sonar lo usa para saber que codigo es nuevo

      - name: Descargar reportes de tests y cobertura
        uses: actions/download-artifact@v4
        with:
          name: test-results
          path: test-results/

      - name: Analisis en SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # Umbrales de la consigna: bugs criticos = 0, duplicacion <= 5 %,
      # cobertura sobre codigo nuevo >= 80 %. Si no se cumplen, el pipeline frena aca.
      - name: Quality gate OptiFull
        run: python .github/scripts/quality_gate.py
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Publicar resultado del quality gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate
          path: test-results/quality-gate.json

  # ────────────────────────────────────────────────────────────────────────────
  system-check:
    name: Comprobar BD (Supabase) + ejecutar sistema completo
    needs: calidad
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: qa   # aca vive el DATABASE_URL de QA
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: test/requirements.txt

      - name: Instalar dependencias
        run: pip install psycopg2-binary python-dotenv pytest requests

      - name: Comprobar conexion y schema de la BD
        run: python db/check_connection.py

      - name: Construir imagen Docker (frontend + backend)
        run: docker build -f docker/Dockerfile-optifull -t optifull:ci .

      - name: Ejecutar el sistema completo en un contenedor
        run: |
          docker run -d --name optifull -p 8080:8080 \
            -e DATABASE_URL="$DATABASE_URL" -e APP_ENV=ci optifull:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/api/health > /dev/null; then
              echo "Sistema arriba tras ${i} intento(s)"; exit 0
            fi
            sleep 2
          done
          echo "::error::El contenedor no respondio en 60s"; docker logs optifull; exit 1

      - name: Pruebas de integracion contra el contenedor
        env:
          BASE_URL: http://localhost:8080
          QA_USUARIO: ${{ secrets.QA_USUARIO }}
          QA_CLAVE: ${{ secrets.QA_CLAVE }}
        run: python -m pytest -c test/pytest.ini test/integracion -v

      - name: Logs del contenedor (si algo fallo)
        if: failure()
        run: docker logs optifull

  # ────────────────────────────────────────────────────────────────────────────
  deploy-qa:
    name: Deploy a QA (Render)
    needs: system-check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: qa
    outputs:
      url: ${{ vars.QA_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar BD de QA
        run: |
          pip install -q psycopg2-binary python-dotenv
          python db/check_connection.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Deploy del commit ${{ github.sha }} y espera
        run: bash .github/scripts/deploy_render.sh "${{ vars.QA_URL }}" "${{ github.sha }}"
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

  # ────────────────────────────────────────────────────────────────────────────
  integration-qa:
    name: Pruebas de integracion en QA
    needs: deploy-qa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install pytest requests
      - name: Correr pruebas de integracion contra QA
        env:
          BASE_URL: ${{ needs.deploy-qa.outputs.url }}
          EXPECTED_COMMIT: ${{ github.sha }}
          QA_USUARIO: ${{ secrets.QA_USUARIO }}
          QA_CLAVE: ${{ secrets.QA_CLAVE }}
        run: >
          python -m pytest -c test/pytest.ini test/integracion -v
          --junitxml=test-results/integracion-qa.xml
      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integracion-qa
          path: test-results/

  # ────────────────────────────────────────────────────────────────────────────
  deploy-prod:
    name: Deploy a Produccion (Render)
    needs: integration-qa
    runs-on: ubuntu-latest
    environment: production   # con "Required reviewers" pide aprobacion manual
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Comprobar BD de produccion
        run: |
          pip install -q psycopg2-binary python-dotenv pytest requests
          python db/check_connection.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Deploy del commit ${{ github.sha }} y espera
        run: bash .github/scripts/deploy_render.sh "${{ vars.PROD_URL }}" "${{ github.sha }}"
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      - name: Smoke test en produccion
        env:
          BASE_URL: ${{ vars.PROD_URL }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: python -m pytest -c test/pytest.ini test/integracion -m smoke -v
