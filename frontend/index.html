<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OptiFull — Dashboard Operativo</title>

    <!-- Google Fonts — preconnect listo para cuando se sumen los <link> de
         cada familia (ver index.css: font-brand/font-ui/font-metric/font-display).
         gstatic sirve los archivos de fuente en sí y requiere crossorigin;
         googleapis sirve el CSS que los referencia. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- font-brand: Quicksand · font-metric: Didact Gothic ·
         font-ui / font-display: Valley Sans (ver index.css) -->
    <link href="https://fonts.googleapis.com/css2?family=Didact+Gothic&family=Quicksand:wght@300..700&family=Valley+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
