# Configuracion del analisis de SonarQube Cloud (lo ejecuta el pipeline, job "calidad").
# El alcance de la medicion esta documentado en docs/calidad/alcance-medicion.md.
sonar.organization=pauliiortizz
sonar.projectKey=pauliiortizz_OptiFull
sonar.projectName=OptiFull

# ── Codigo del producto ──────────────────────────────────────────────────────────
sonar.sources=frontend/api,frontend/src,deteccion,deteccion_productos
sonar.exclusions=\
  deteccion/mantenimiento/**,\
  deteccion_productos/test_*.py,\
  frontend/src/**/*.test.js,\
  frontend/src/**/*.test.jsx,\
  frontend/src/test/**,\
  **/__pycache__/**

# ── Tests ───────────────────────────────────────────────────────────────────────
sonar.tests=test,frontend/src
sonar.test.inclusions=test/**/*.py,frontend/src/**/*.test.js,frontend/src/**/*.test.jsx,frontend/src/test/**

# ── Reportes que genera el job build-test ───────────────────────────────────────
sonar.python.version=3.12
sonar.python.coverage.reportPaths=test-results/coverage.xml
sonar.python.xunit.reportPath=test-results/unitarios.xml
sonar.javascript.lcov.reportPaths=test-results/lcov.info

sonar.sourceEncoding=UTF-8
