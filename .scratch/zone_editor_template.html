<!doctype html>
<title>Editor de zonas — OptiFull</title>
<style>
  :root{
    --bg-0:#070b14; --bg-1:#0c1322; --bg-2:#111a2e; --bg-3:#172238; --bg-4:#1d2a44;
    --line:#1f2c47; --line-soft:#19233a;
    --fg-0:#eef3fb; --fg-1:#c5d0e3; --fg-2:#8a98b3; --fg-3:#5a6886;
    --brand:#2563a8; --brand-soft:#4a86c9;
    --caja:#e25c4e; --gondolas:#4a86c9; --salon:#2ea34f;
  }
  :root[data-theme="light"]{
    --bg-0:#f4f6fb; --bg-1:#ffffff; --bg-2:#ffffff; --bg-3:#eef1f8; --bg-4:#e4e9f4;
    --line:#dde3f0; --line-soft:#e8ecf6;
    --fg-0:#0f1726; --fg-1:#33405c; --fg-2:#66738f; --fg-3:#8894ac;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg-0:#f4f6fb; --bg-1:#ffffff; --bg-2:#ffffff; --bg-3:#eef1f8; --bg-4:#e4e9f4;
      --line:#dde3f0; --line-soft:#e8ecf6;
      --fg-0:#0f1726; --fg-1:#33405c; --fg-2:#66738f; --fg-3:#8894ac;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg-0);color:var(--fg-0);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,ui-sans-serif,sans-serif}
  .mono{font-family:ui-monospace,"SFMono-Regular","JetBrains Mono",Menlo,Consolas,monospace}
  button{font-family:inherit}

  .app{display:flex;flex-direction:column;height:100vh}

  header{display:flex;align-items:center;gap:18px;padding:14px 20px;
    border-bottom:1px solid var(--line-soft);background:var(--bg-1);flex-shrink:0}
  header h1{font-size:15px;font-weight:600;margin:0;letter-spacing:-.01em}
  header .sub{font-size:11.5px;color:var(--fg-3);margin-top:1px}

  .cams{display:flex;gap:4px;margin-left:auto;background:var(--bg-3);padding:3px;border-radius:9px;border:1px solid var(--line)}
  .cams button{border:0;background:transparent;color:var(--fg-2);font-size:12px;font-weight:500;
    padding:6px 13px;border-radius:6px;cursor:pointer;transition:background .12s,color .12s}
  .cams button.on{background:var(--brand);color:#fff}
  .cams button:not(.on):hover{background:var(--bg-4);color:var(--fg-0)}
  .cams button .dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px;background:var(--fg-3)}
  .cams button.done .dot{background:var(--pos-soft,#2ea34f)}

  .body{flex:1;display:flex;min-height:0}

  .stage{flex:1;display:flex;align-items:center;justify-content:center;padding:22px;overflow:auto;position:relative}
  .canvas-wrap{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);
    box-shadow:0 10px 30px -12px rgba(0,0,0,.5);background:#0e1729}
  canvas{display:block;cursor:crosshair;touch-action:none}

  .hint{position:absolute;left:50%;bottom:-38px;transform:translateX(-50%);
    font-size:11.5px;color:var(--fg-3);white-space:nowrap;text-align:center}
  .hint b{color:var(--fg-1);font-weight:500}
  .hint kbd{font-family:ui-monospace,monospace;background:var(--bg-3);border:1px solid var(--line);
    border-radius:4px;padding:1px 5px;font-size:10.5px;color:var(--fg-1)}

  aside{width:308px;flex-shrink:0;border-left:1px solid var(--line-soft);background:var(--bg-1);
    display:flex;flex-direction:column;overflow-y:auto}
  .side-sec{padding:16px 18px;border-bottom:1px solid var(--line-soft)}
  .side-sec h2{font-size:10.5px;font-weight:600;color:var(--fg-3);text-transform:uppercase;
    letter-spacing:.07em;margin:0 0 11px}

  .zone-types{display:flex;flex-direction:column;gap:6px}
  .zone-type{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;
    border:1px solid var(--line);background:var(--bg-2);cursor:pointer;transition:border-color .12s,background .12s}
  .zone-type:hover{background:var(--bg-3)}
  .zone-type.on{border-color:var(--accent);background:var(--bg-3);box-shadow:0 0 0 1px var(--accent) inset}
  .zone-type .swatch{width:13px;height:13px;border-radius:4px;flex-shrink:0}
  .zone-type .lbl{font-size:12.5px;color:var(--fg-1);font-weight:500}
  .zone-type .cnt{margin-left:auto;font-size:10.5px;color:var(--fg-3)}
  .zone-type.on .lbl{color:var(--fg-0)}

  .drawing-box{font-size:12px;color:var(--fg-2);line-height:1.55}
  .drawing-box .pt-count{color:var(--fg-0);font-weight:600}
  .btn-row{display:flex;gap:7px;margin-top:11px}
  .btn{flex:1;border:1px solid var(--line);background:var(--bg-3);color:var(--fg-1);
    font-size:12px;font-weight:500;padding:7px 0;border-radius:7px;cursor:pointer;transition:background .12s}
  .btn:hover:not(:disabled){background:var(--bg-4)}
  .btn:disabled{opacity:.35;cursor:default}
  .btn-accent{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn-accent:hover:not(:disabled){filter:brightness(1.08)}
  .btn-full{width:100%}

  .zone-list{display:flex;flex-direction:column;gap:6px}
  .zone-item{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:7px;
    background:var(--bg-2);border:1px solid var(--line-soft)}
  .zone-item .swatch{width:10px;height:10px;border-radius:3px;flex-shrink:0}
  .zone-item .nm{font-size:12px;color:var(--fg-1);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .zone-item .pts{font-size:10px;color:var(--fg-3)}
  .zone-item button{border:0;background:transparent;color:var(--fg-3);cursor:pointer;font-size:13px;
    padding:2px 5px;border-radius:4px;line-height:1}
  .zone-item button:hover{color:var(--caja);background:var(--bg-4)}
  .empty{font-size:11.5px;color:var(--fg-3);padding:8px 0;font-style:italic}

  .export-sec{margin-top:auto;padding:16px 18px}
  .export-count{font-size:11.5px;color:var(--fg-2);margin-bottom:10px}
  .export-count b{color:var(--fg-0)}
  textarea{width:100%;height:150px;background:var(--bg-2);border:1px solid var(--line);
    border-radius:8px;color:var(--fg-1);font-size:10.5px;padding:9px;resize:vertical;margin-top:10px;display:none}
  textarea.show{display:block}
  .copied{color:var(--pos-soft,#2ea34f);font-size:11px;margin-top:6px;opacity:0;transition:opacity .2s}
  .copied.show{opacity:1}

  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <header>
    <div>
      <h1>Editor de zonas</h1>
      <div class="sub">Marcá los polígonos sobre la foto de cada cámara — export listo para pegar en Supabase</div>
    </div>
    <div class="cams" id="camTabs"></div>
  </header>

  <div class="body">
    <div class="stage">
      <div class="canvas-wrap" id="canvasWrap">
        <canvas id="cv"></canvas>
      </div>
      <div class="hint" id="hint"></div>
    </div>

    <aside>
      <div class="side-sec">
        <h2>Tipo de zona</h2>
        <div class="zone-types" id="zoneTypes"></div>
      </div>

      <div class="side-sec">
        <h2>Zona en curso</h2>
        <div class="drawing-box">
          Clic para agregar puntos · <span class="pt-count" id="ptCount">0</span> puntos
        </div>
        <div class="btn-row">
          <button class="btn" id="btnUndo">Deshacer punto</button>
          <button class="btn" id="btnCancel">Cancelar</button>
        </div>
        <button class="btn btn-accent btn-full" id="btnClose" style="margin-top:7px" disabled>Cerrar zona (min. 3 puntos)</button>
      </div>

      <div class="side-sec">
        <h2>Zonas en esta cámara</h2>
        <div class="zone-list" id="zoneList"></div>
      </div>

      <div class="export-sec">
        <h2 style="font-size:10.5px;font-weight:600;color:var(--fg-3);text-transform:uppercase;letter-spacing:.07em;margin:0 0 4px">Exportar</h2>
        <div class="export-count" id="exportCount">0 zonas definidas en total</div>
        <div class="btn-row">
          <button class="btn" id="btnSql">Ver SQL</button>
          <button class="btn" id="btnJson">Ver JSON</button>
        </div>
        <button class="btn btn-accent btn-full" id="btnCopy" style="margin-top:7px" disabled>Copiar al portapapeles</button>
        <div class="copied" id="copiedMsg">Copiado ✓</div>
        <textarea class="mono" id="exportArea" readonly></textarea>
      </div>
    </aside>
  </div>
</div>

<script>
// ── Datos de las 4 camaras: foto ya recortada del margen negro (mismo
// recorte que usa el dashboard) + su tamaño natural en px. ──────────────
const IMAGES = __IMAGES__;

// Las fotos de fondo estan recortadas a "contenido" (2250x1170) pero los
// videos analizados son 1920x1080 -- todo clic se convierte a esa escala
// real antes de guardarse, para que coincida con las coordenadas que usa
// deteccion/main.py (frame_w/frame_h reales del video).
const VIDEO_W = 1920, VIDEO_H = 1080;
const CONTENT_W = 2250, CONTENT_H = 1170;
const SX = VIDEO_W / CONTENT_W, SY = VIDEO_H / CONTENT_H;

const ZONE_TYPES = [
  { tipo: 'caja',     nombre: 'Zona Caja',     color: 'var(--caja)',     hex: '#e25c4e' },
  { tipo: 'gondola',  nombre: 'Zona Gondolas', color: 'var(--gondolas)', hex: '#4a86c9' },
  { tipo: 'salon',    nombre: 'Zona Salon',    color: 'var(--salon)',   hex: '#2ea34f' },
];

// La columna 'tipo' de la tabla zonas tiene un CHECK constraint que solo
// acepta entrada/salida/caja/gondola/deposito/otro -- "salon" no es un
// valor valido en la BD, asi que se mapea a 'otro' solo al exportar (el
// nombre visible sigue siendo "Zona Salon", el tipo interno 'salon' se
// mantiene para los colores/UI del editor).
const TIPO_DB = { caja: 'caja', gondola: 'gondola', salon: 'otro' };

const STORAGE_KEY = 'optifull_zonas_editor_v1';

let state = load() || { 1: [], 2: [], 3: [] , 4: [] };
let camaraId = 1;
let currentType = ZONE_TYPES[0];
let drawingPts = []; // puntos del poligono en curso, en px de CONTENIDO (imagen recortada)
let mousePt = null;
let img = new Image();

function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
function load(){ try { return JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch(e){ return null; } }

// ── Camara tabs ──────────────────────────────────────────────────────────
const camTabs = document.getElementById('camTabs');
function renderTabs(){
  camTabs.innerHTML = '';
  [1,2,3,4].forEach(id => {
    const b = document.createElement('button');
    b.className = (id === camaraId ? 'on ' : '') + (state[id].length > 0 ? 'done' : '');
    b.innerHTML = `<span class="dot"></span>Cámara ${id}`;
    b.onclick = () => { camaraId = id; drawingPts = []; loadImage(); renderAll(); };
    camTabs.appendChild(b);
  });
}

// ── Zone type selector ──────────────────────────────────────────────────
const zoneTypesEl = document.getElementById('zoneTypes');
function renderZoneTypes(){
  zoneTypesEl.innerHTML = '';
  ZONE_TYPES.forEach(zt => {
    const count = state[camaraId].filter(z => z.tipo === zt.tipo).length;
    const el = document.createElement('div');
    el.className = 'zone-type' + (currentType.tipo === zt.tipo ? ' on' : '');
    el.style.setProperty('--accent', zt.color);
    el.innerHTML = `<span class="swatch" style="background:${zt.color}"></span>
      <span class="lbl">${zt.nombre}</span><span class="cnt">${count}</span>`;
    el.onclick = () => { currentType = zt; renderZoneTypes(); };
    zoneTypesEl.appendChild(el);
  });
}

// ── Canvas / dibujo ───────────────────────────────────────────────────────
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const wrap = document.getElementById('canvasWrap');
const hint = document.getElementById('hint');

let DISPLAY_SCALE = 1; // px de pantalla por px de "contenido"

function loadImage(){
  const [src] = IMAGES[camaraId];
  img = new Image();
  img.onload = () => {
    // OJO: la imagen embebida esta reescalada a la mitad (1125x585) para no
    // inflar el archivo HTML -- DISPLAY_SCALE tiene que calcularse contra
    // CONTENT_W/CONTENT_H (el espacio de coordenadas REAL, 2250x1170), NO
    // contra el tamano en px del archivo de imagen. Antes se calculaba
    // contra el tamano del archivo, asi que cada clic quedaba grabado a la
    // mitad de la coordenada real -- ver poligonos corregidos x2 en la BD.
    const maxW = Math.min(window.innerWidth - 380, 1000);
    DISPLAY_SCALE = Math.min(1, maxW / CONTENT_W);
    cv.width = CONTENT_W * DISPLAY_SCALE;
    cv.height = CONTENT_H * DISPLAY_SCALE;
    draw();
  };
  img.src = src;
}

function toContentPx(evt){
  const r = cv.getBoundingClientRect();
  const x = (evt.clientX - r.left) / DISPLAY_SCALE;
  const y = (evt.clientY - r.top) / DISPLAY_SCALE;
  return [Math.max(0, Math.min(CONTENT_W, x)), Math.max(0, Math.min(CONTENT_H, y))];
}

function draw(){
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.drawImage(img, 0, 0, cv.width, cv.height);

  // Zonas ya cerradas de esta camara
  state[camaraId].forEach(z => {
    const zt = ZONE_TYPES.find(t => t.tipo === z.tipo);
    drawPoly(z.puntosContenido, zt.hex, true, z.nombre);
  });

  // Poligono en curso
  if (drawingPts.length > 0){
    drawPoly(drawingPts, currentType.hex, false);
    drawingPts.forEach((p, i) => {
      ctx.beginPath();
      ctx.arc(p[0]*DISPLAY_SCALE, p[1]*DISPLAY_SCALE, i===0 ? 5 : 3.5, 0, Math.PI*2);
      ctx.fillStyle = i===0 ? '#fff' : currentType.hex;
      ctx.strokeStyle = currentType.hex;
      ctx.lineWidth = 1.5;
      ctx.fill(); ctx.stroke();
    });
    if (mousePt){
      ctx.beginPath();
      ctx.setLineDash([4,4]);
      ctx.moveTo(drawingPts[drawingPts.length-1][0]*DISPLAY_SCALE, drawingPts[drawingPts.length-1][1]*DISPLAY_SCALE);
      ctx.lineTo(mousePt[0]*DISPLAY_SCALE, mousePt[1]*DISPLAY_SCALE);
      ctx.strokeStyle = currentType.hex + '99';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }
}

function drawPoly(pts, hex, closed, label){
  if (pts.length < 2 && closed === false) {
    if (pts.length === 1) return;
  }
  ctx.beginPath();
  pts.forEach((p, i) => {
    const x = p[0]*DISPLAY_SCALE, y = p[1]*DISPLAY_SCALE;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  if (closed) ctx.closePath();
  ctx.fillStyle = hex + (closed ? '3d' : '00');
  if (closed) ctx.fill();
  ctx.strokeStyle = hex;
  ctx.lineWidth = 2.5;
  ctx.stroke();

  if (closed && label){
    const cx = pts.reduce((a,p) => a+p[0], 0) / pts.length * DISPLAY_SCALE;
    const cy = pts.reduce((a,p) => a+p[1], 0) / pts.length * DISPLAY_SCALE;
    ctx.font = '600 12px -apple-system, sans-serif';
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.shadowColor = 'rgba(0,0,0,.85)';
    ctx.shadowBlur = 6;
    ctx.fillText(label, cx, cy);
    ctx.shadowBlur = 0;
  }
}

cv.addEventListener('click', (e) => {
  drawingPts.push(toContentPx(e));
  updateDrawingUi();
  draw();
});
cv.addEventListener('mousemove', (e) => {
  if (drawingPts.length === 0) return;
  mousePt = toContentPx(e);
  draw();
});
cv.addEventListener('dblclick', (e) => { e.preventDefault(); closeZone(); });

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') cancelDrawing();
  if (e.key === 'Enter') closeZone();
  if (e.key === 'Backspace' || e.key === 'z' && (e.metaKey||e.ctrlKey)) undoPoint();
});

function undoPoint(){ drawingPts.pop(); updateDrawingUi(); draw(); }
function cancelDrawing(){ drawingPts = []; mousePt = null; updateDrawingUi(); draw(); }

function closeZone(){
  if (drawingPts.length < 3) return;
  const nombre = currentType.nombre;
  state[camaraId].push({ tipo: currentType.tipo, nombre, puntosContenido: drawingPts.slice() });
  drawingPts = [];
  mousePt = null;
  save();
  renderAll();
}

function updateDrawingUi(){
  document.getElementById('ptCount').textContent = drawingPts.length;
  document.getElementById('btnClose').disabled = drawingPts.length < 3;
  document.getElementById('btnClose').textContent = drawingPts.length < 3
    ? 'Cerrar zona (min. 3 puntos)' : 'Cerrar zona';
}

document.getElementById('btnUndo').onclick = undoPoint;
document.getElementById('btnCancel').onclick = cancelDrawing;
document.getElementById('btnClose').onclick = closeZone;

// ── Lista de zonas + borrar ───────────────────────────────────────────────
function renderZoneList(){
  const el = document.getElementById('zoneList');
  const zonas = state[camaraId];
  if (zonas.length === 0){
    el.innerHTML = '<div class="empty">Sin zonas todavía en esta cámara</div>';
    return;
  }
  el.innerHTML = '';
  zonas.forEach((z, i) => {
    const zt = ZONE_TYPES.find(t => t.tipo === z.tipo);
    const item = document.createElement('div');
    item.className = 'zone-item';
    item.innerHTML = `<span class="swatch" style="background:${zt.hex}"></span>
      <span class="nm">${z.nombre}</span>
      <span class="pts mono">${z.puntosContenido.length}pt</span>
      <button title="Borrar">✕</button>`;
    item.querySelector('button').onclick = () => {
      state[camaraId].splice(i, 1); save(); renderAll();
    };
    el.appendChild(item);
  });
}

// ── Export ────────────────────────────────────────────────────────────────
function toVideoSpace(pts){
  return pts.map(([x,y]) => [Math.round(x*SX), Math.round(y*SY)]);
}

function allZonesFlat(){
  const rows = [];
  [1,2,3,4].forEach(cam => {
    state[cam].forEach(z => rows.push({ camara_id: cam, nombre: z.nombre, tipo: TIPO_DB[z.tipo] || z.tipo,
      poligono: toVideoSpace(z.puntosContenido) }));
  });
  return rows;
}

function buildSql(){
  const rows = allZonesFlat();
  if (rows.length === 0) return '-- No hay zonas definidas todavía.';
  let sql = 'DELETE FROM zonas;\n\n';
  rows.forEach(r => {
    sql += `INSERT INTO zonas (camara_id, nombre, tipo, poligono) VALUES (${r.camara_id}, '${r.nombre}', '${r.tipo}', '${JSON.stringify(r.poligono)}');\n`;
  });
  return sql;
}

function buildJson(){
  return JSON.stringify(allZonesFlat(), null, 2);
}

function updateExportCount(){
  const n = allZonesFlat().length;
  document.getElementById('exportCount').innerHTML = `<b>${n}</b> zona${n===1?'':'s'} definida${n===1?'':'s'} en total (las 4 cámaras)`;
  document.getElementById('btnCopy').disabled = n === 0;
}

const exportArea = document.getElementById('exportArea');
document.getElementById('btnSql').onclick = () => {
  exportArea.value = buildSql(); exportArea.classList.add('show');
};
document.getElementById('btnJson').onclick = () => {
  exportArea.value = buildJson(); exportArea.classList.add('show');
};
document.getElementById('btnCopy').onclick = () => {
  const text = exportArea.value && exportArea.classList.contains('show') ? exportArea.value : buildSql();
  exportArea.value = text; exportArea.classList.add('show');
  navigator.clipboard.writeText(text).then(() => {
    const msg = document.getElementById('copiedMsg');
    msg.classList.add('show');
    setTimeout(() => msg.classList.remove('show'), 1600);
  });
};

function renderAll(){
  renderTabs();
  renderZoneTypes();
  renderZoneList();
  updateDrawingUi();
  updateExportCount();
  draw();
}

hint.innerHTML = 'Clic para agregar puntos · <b>doble clic</b> o <kbd>Enter</kbd> para cerrar la zona · <kbd>Esc</kbd> cancela · <kbd>⌫</kbd> deshace el último punto';

loadImage();
renderAll();
window.addEventListener('resize', () => loadImage());
</script>
