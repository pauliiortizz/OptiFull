[pytest]
; Config propia de OptiFull, separada de la de ultralytics (pyproject.toml en
; la raiz del repo) -- por eso vive aca adentro y no se usa --doctest-modules,
; que intentaria importar y testear como doctest todo el codigo de ultralytics.
; 'integracion' NO esta en testpaths: necesita un despliegue corriendo (BASE_URL),
; asi que el pipeline la invoca explicitamente contra el contenedor/QA/PROD.
testpaths = unitarios mocks
python_files = test_*.py
python_functions = test_*
addopts = -q
markers =
    smoke: chequeos minimos de un despliegue (se corren tambien contra produccion)
