[pytest]
; Config propia de OptiFull, separada de la de ultralytics (pyproject.toml en
; la raiz del repo) -- por eso vive aca adentro y no se usa --doctest-modules,
; que intentaria importar y testear como doctest todo el codigo de ultralytics.
testpaths = unitarios mocks
python_files = test_*.py
python_functions = test_*
addopts = -q
