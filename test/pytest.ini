[pytest]
; Config propia de los tests de OptiFull.
; 'integracion' NO esta en testpaths: necesita un despliegue corriendo (BASE_URL),
; asi que el pipeline la invoca explicitamente contra el contenedor/QA/PROD.
testpaths = unitarios mocks
python_files = test_*.py
python_functions = test_*
addopts = -q
markers =
    smoke: chequeos minimos de un despliegue (se corren tambien contra produccion)
    sin_sesion: el test no usa la sesion de prueba (prueba la cookie de sesion real)
    e2e: flujo completo con un navegador real contra un despliegue (test/e2e, necesita BASE_URL)
